name: CI

on: [push, pull_request]

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all --tests --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - stable

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install dependencies
        run: sudo apt-get install libssl-dev

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check
        run: cargo hack check --feature-powerset --all-targets

      - name: Test
        run: cargo test --release

  test-msvr:
    name: Test MSRV
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - 1.85.0

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install dependencies
        run: sudo apt-get install libssl-dev

      - name: Disable env_logger dev-dependency (cargo 1.68.2 workaround)
        run: sed -i 's/env_logger/#env_logger/' Cargo.toml

      - name: Check
        run: cargo check

  autobahn:
    name: Autobahn tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Running Autobahn TestSuite for client
        run: ./scripts/autobahn-client.sh

      - name: Running Autobahn TestSuite for server
        run: ./scripts/autobahn-server.sh

      # wstest writes index.json and the per-case reports into the mounted
      # volume as it runs, so an arm that fails test_diff still leaves behind
      # the results the oracle has to be regenerated from.
      - name: Preserve the Autobahn reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports-${{ matrix.rust }}
          path: |
            autobahn/client/
            autobahn/server/
          if-no-files-found: warn
          retention-days: 7
